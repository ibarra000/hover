name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test (the live tests need Ollama and a desktop, so they're skipped here)
        run: dotnet test tests/Hover.Tests --filter "Category!=Live"
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/Hover -c Release -o publish -p:Version=$version
          dotnet build installer -c Release -p:Version=$version
      - run: gh release create "${{ github.ref_name }}" (Get-ChildItem installer/bin/x64/Release/*.msi) --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
