name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run cxfreeze bdist_msi
      - run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.msi) --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
